description: Broker Genius provides AI‑powered customs brokerage automation for brokers, freight forwarders, and trade teams. The platform reads
  invoices, classifies line items, assigns HS codes, and generates ASYCUDA‑compatible declarations, reducing manual entry time by up to 80%. Built
  in Anguilla, it offers a web portal, REST API, and webhooks to integrate with existing TMS and ERP systems, with a free trial and no credit‑card
  required.

